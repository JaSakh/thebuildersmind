name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC: pick up new YouTube uploads

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Adds new uploads and chapters from YouTube (scripts/youtube.mjs) and commits them.
  sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: node scripts/youtube.mjs
      - id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Sync episodes from YouTube"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: sync
    # Every push and manual run; scheduled runs only when the sync changed something.
    if: ${{ !failure() && !cancelled() && (github.event_name != 'schedule' || needs.sync.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # include the sync commit, if any
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run build
        env:
          # "/thebuildersmind" on github.io, "" once a custom domain is set
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_FORM_ENDPOINT: ${{ vars.NEXT_PUBLIC_FORM_ENDPOINT }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    # Needed because `sync` is skipped on pushes, and skipped jobs otherwise skip everything after them.
    if: ${{ !failure() && !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
